name: Publish @jsotoexelixitech/nest-api-sdk

on:
  workflow_dispatch:
  push:
    tags:
      - 'nest-api-sdk-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jsotoexelixitech'

      - name: Install & build SDK
        working-directory: packages/nest-api-sdk
        run: |
          npm install
          npm run build
          test -f dist/index.js

      - name: Publish to GitHub Packages
        working-directory: packages/nest-api-sdk
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
